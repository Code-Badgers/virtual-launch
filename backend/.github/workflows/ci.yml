name: Java CI

on:
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 테스트 및 빌드 실행 (환경변수 주입)
      - name: Build with Gradle
        run: ./gradlew build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}